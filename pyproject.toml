[project]
name = "tai-public-finance"
version = "0.1.0"
description = "Numerical implementation and calibration of a model of optimal public finance under automation shocks"
readme = "README.md"
authors = [
    { name = "Nathan Barnard", email = "55846765+Nathan-Barnard@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
]
