  conclusion: The configured Stage 1 (deterministic/first-order) and Stage 2A (leading
    small-risk) calculations passed their numerical and local-applicability checks.
  limitations:
  - Local T3/LQ evidence only; no global constrained or off-specialisation optimality
    claim.
  - The Farhi-based vector is illustrative rather than an empirical UK calibration.
  - epsilon=1 reports the leading small-risk coefficient at the primitive volatility
    scale; it is not an exact finite-risk welfare result.
  - No exact precautionary consumption or tax-speed correction is reported; those
    require a Stage 2B specification with higher deterministic fiscal-wealth derivatives,
    or an explicit truncated stochastic-LQ closure.
  - The stable four-state block has a stationary covariance, but public net worth
    and worker consumption retain a neutral direction and need not be stationary.
  - Finite-horizon positive-X and boundary-slack checks are local continuation plausibility,
    not a global stochastic solvency or transversality proof.
  - CS001 is registered as draft in the codex research workspace; this run implements
    its stated scope under Nathan's direct commission rather than a formally approved
    fingerprint.
  next_decision: Use the identical primitive fingerprint for the matched PDE-LQ bridge
    once CS004 is approved; reserve exact precautionary policies for a Stage 2B specification.
